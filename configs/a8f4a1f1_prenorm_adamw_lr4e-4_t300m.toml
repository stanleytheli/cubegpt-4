# CubeGPT-4 architecture, 307M samples at lr 4e-4. This run is both:
#   - models/cubegpt-4-t300m.pth (its final weights, eval loss 0.10386; CubeGPT-3.1: 0.10667), and
#   - the first 230.4M samples of CubeGPT-4 (models/cubegpt-4-t1b.pth), which continues from this run's
#     model_230400000.pt snapshot with configs/a8f4a1f1_branch230m_to_1b.toml.
# Same as configs/a8f4a1f1_prenorm_adamw_t300m.toml except lr 4e-4: lr 8e-4 won the 25.6M sweeps but
# stalled near 0.119 from about 60M samples in the long run.
# 8 attention-only layers, 4 FFN-only layers, then one more attention layer and one more FFN. 3.82M params.
name = "a8f4a1f1-prenorm-adamw-lr4e-4-t300m"
gpu = "H100"
seed = 0
adam_fused = false
grad_clip = 1.0
adam_beta2 = 0.95
weight_decay = 0.1
divergence_rollbacks = 3
divergence_lr_factor = 0.7
keep_every_samples = 25_600_000

[model]
arch = "gated"
d_model = 256
n_heads = 16
d_ffwd = 341
n_layers = 14
ffn_layers = "00000000ffff0f"
pre_norm = true

[[stages]]
label = "wsd"
samples = 307_200_000
batch_size = 1024
lr = 4e-4
schedule = "wsd"
warmup_samples = 1_280_000
decay_samples = 61_440_000
eval_every_samples = 512_000
