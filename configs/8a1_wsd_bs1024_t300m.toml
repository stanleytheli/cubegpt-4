# Long warmup-stable-decay run: 307.2M samples (t300m's data budget) at batch 1024.
# Settings from the 25.6M-sample sweep (configs/wsd_sweep_25m.toml, runs wsd25m-*):
#   batch 1024: lr 1e-4 0.1348 | 2e-4 0.1314 | 4e-4 0.1270 | 5.6e-4 0.1242 | 8e-4 diverged
#   batch 4096: lr 8e-4 0.1276 (best; 1.1e-3 and 1.6e-3 diverged)
#   cosine (0.1297) lost to wsd; a 40% decay (0.1273) matched 20% (0.1270).
# 5.6e-4 sits just below the divergence cliff and this run holds it ~10x longer than the
# sweep did, so divergence_rollbacks lets it recover: on a blowup it restarts from the last
# healthy checkpoint at 0.7x the peak lr (5.6e-4 -> 3.9e-4 -> 2.7e-4 -> 1.9e-4).
# Snapshots every 25.6M samples (ckpt/model_<samples>.pt) allow branching cooldowns later.
name = "8a1-wsd-bs1024-t300m"
gpu = "H100"
seed = 0
divergence_rollbacks = 3
divergence_lr_factor = 0.7
keep_every_samples = 25_600_000

[model]
arch = "moe"
d_model = 256
n_heads = 16
d_ffwd = 341
n_layers = 8
n_experts = 8
n_active = 1

[[stages]]
label = "wsd"
samples = 307_200_000
batch_size = 1024
lr = 5.6e-4
schedule = "wsd"
warmup_samples = 1_280_000
decay_samples = 61_440_000
eval_every_samples = 512_000
